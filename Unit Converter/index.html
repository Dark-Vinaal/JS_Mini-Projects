<!DOCTYPE html>
<html>
<head>
    <title>Unit Converter</title>

    <style>
        body {
            font-family: Arial;
            background: #eee;
            padding: 40px;
        }

        .container {
            max-width: 450px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
        }

        input,
        select,
        button {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            box-sizing: border-box;
        }

        button {
            cursor: pointer;
        }

        #result {
            margin-top: 20px;
            font-size: 20px;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Unit Converter</h1>

    <input
        type="number"
        id="value"
        placeholder="Enter value"
    >

    <select id="conversion">

        <option value="km-mile">
            Kilometer → Mile
        </option>

        <option value="mile-km">
            Mile → Kilometer
        </option>

        <option value="meter-feet">
            Meter → Feet
        </option>

        <option value="feet-meter">
            Feet → Meter
        </option>

        <option value="kg-pound">
            Kilogram → Pound
        </option>

        <option value="pound-kg">
            Pound → Kilogram
        </option>

        <option value="c-f">
            Celsius → Fahrenheit
        </option>

        <option value="f-c">
            Fahrenheit → Celsius
        </option>

    </select>

    <button onclick="convert()">
        Convert
    </button>

    <div id="result"></div>

</div>

<script>

function convert() {

    const value = Number(
        document.getElementById("value").value
    );

    const conversion =
        document.getElementById("conversion").value;

    let result;

    if (isNaN(value)) {
        document.getElementById("result").innerText =
            "Enter a valid number.";
        return;
    }

    switch (conversion) {

        case "km-mile":
            result = value * 0.621371;
            break;

        case "mile-km":
            result = value * 1.60934;
            break;

        case "meter-feet":
            result = value * 3.28084;
            break;

        case "feet-meter":
            result = value * 0.3048;
            break;

        case "kg-pound":
            result = value * 2.20462;
            break;

        case "pound-kg":
            result = value * 0.453592;
            break;

        case "c-f":
            result = (value * 9 / 5) + 32;
            break;

        case "f-c":
            result = (value - 32) * 5 / 9;
            break;
    }

    document.getElementById("result").innerText =
        `Result: ${result.toFixed(2)}`;
}

</script>

</body>
</html>
